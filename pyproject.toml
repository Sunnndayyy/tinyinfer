[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyinfer"
version = "0.1.0"
description = "A small, readable LLM inference server built from first principles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "huggingface-hub>=0.27",
  "numpy>=2",
  "safetensors>=0.5",
  "starlette>=0.45",
  "tokenizers>=0.21",
  "torch>=2.13",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
tinyinfer = "tinyinfer.cli:main"

[tool.setuptools.packages.find]
include = ["tinyinfer*"]

[tool.setuptools.package-data]
"tinyinfer.quantization" = ["*.metal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["TRY004"]
